<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - SecureShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8; /* Google Blue */
            --primary-dark: #155bb3;
            --background-light: #f5f7fa;
            --card-background: #ffffff;
            --text-color: #3c4043; /* Dark text */
            --border-color: #e0e0e0;
            --error-bg: #fce8e6;
            --error-text: #c5221f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--background-light);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- Container/Card Styling --- */
        .container {
            background: var(--card-background);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .project-title {
            color: var(--primary-color);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: #70757a;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        h2 {
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        /* --- Error Message Style --- */
        .error-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: left;
            font-size: 14px;
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #f1c3c1;
        }

        /* --- Form Elements --- */
        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fcfcfc;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
            background-color: var(--card-background);
        }

        /* --- Button --- */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            margin-bottom: 30px;
        }

        button:hover {
            background-color: var(--primary-dark);
            box-shadow: 0 2px 5px rgba(26, 115, 232, 0.3);
        }

        /* --- Link --- */
        .register-link {
            color: var(--primary-color);
            text-decoration: none;
            text-align: center;
            display: block;
            font-weight: 500;
            font-size: 15px;
        }

        .register-link:hover {
            text-decoration: underline;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="project-title">Secure Share</div>
    <div class="tagline">Share your files securely.</div>

    <h2>Sign In</h2>

    <div th:if="${param.error}" class="error-message">
        ⚠️ Invalid username or password. Please try again.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Your username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your secure password" required>

        <button type="submit">Sign In</button>
    </form>

    <a href="/register" class="register-link">Don't have an account? Create Account</a>
</div>
</body>
</html>
