<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - SecureShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-dark: #155bb3;
            --background-light: #f5f7fa;
            --card-background: #ffffff;
            --text-color: #3c4043;
            --danger-color: #d93025;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--background-light);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background-color: var(--card-background);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logout-btn {
            background-color: var(--danger-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            background: var(--card-background);
            border-radius: 10px;
            margin-bottom: 30px;
            border-collapse: collapse;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .action-links a {
            margin-right: 15px;
            font-weight: 500;
            color: var(--primary-color);
            text-decoration: none;
        }

        .delete-link { color: var(--danger-color); }

        #popupOverlay {
            display: none;
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.4);
            z-index: 9998;
        }

        #sharePopup {
            display: none;
            position: fixed;
            left:50%; top:50%;
            transform: translate(-50%,-50%);
            background:white;
            padding:25px;
            width:300px;
            border-radius:10px;
            z-index:9999;
        }

        select, input {
            width:100%;
            padding:10px;
            border:1px solid var(--border-color);
            border-radius:6px;
            margin-top:8px;
        }
    </style>
</head>

<body>

<header class="app-header">
    <a href="/" class="project-title">Secure Share</a>
    <a href="/logout" class="logout-btn">Logout</a>
</header>

<div class="main-content">

    <h2>Welcome Back, <span th:text="${username}"></span>!</h2>

    <table>
        <thead>
        <tr>
            <th>File Name</th>
            <th>Type</th>
            <th>Size (MB)</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${files.size() == 0}">
            <td colspan="4" style="text-align:center;">No files uploaded.</td>
        </tr>

        <tr th:each="file : ${files}">
            <td th:text="${file.fileName}"></td>
            <td th:text="${file.fileType}"></td>
            <td th:text="${file.fileSizeMB}"></td>

            <td class="action-links">
                <a href="#" th:onclick="'openSharePopup(' + ${file.id} + '); return false;'">Share</a>
                <a th:href="@{'/download/' + ${file.id}}">Download</a>
                <a th:href="@{'/delete/' + ${file.id}}" class="delete-link">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div id="popupOverlay" onclick="closeSharePopup()"></div>

<div id="sharePopup">
    <h3 style="text-align:center;">Share File</h3>

    <form id="shareForm" method="post">
        <label>Enter Username:</label>
        <input type="text" name="targetUser" required>

        <label>Select Encryption:</label>
        <select name="method" required>
            <option value="AES" selected>AES (Default)</option>
            <option value="X25519">X25519 (Coming Soon)</option>
        </select>

        <br><br>

        <button style="width:100%;padding:10px;">Share</button>
        <button type="button" style="margin-top:10px;width:100%;padding:10px;background:#ccc;"
                onclick="closeSharePopup()">Cancel</button>
    </form>
</div>

<script>
    function openSharePopup(fileId) {
        document.getElementById("popupOverlay").style.display = "block";
        document.getElementById("sharePopup").style.display = "block";
        document.getElementById("shareForm").action = "/share/" + fileId;
    }

    function closeSharePopup() {
        document.getElementById("popupOverlay").style.display = "none";
        document.getElementById("sharePopup").style.display = "none";
    }
</script>

</body>
</html>
