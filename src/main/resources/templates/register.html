<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - SecureShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8; /* Google Blue */
            --primary-dark: #155bb3;
            --background-light: #f5f7fa;
            --card-background: #ffffff;
            --text-color: #3c4043; /* Dark text */
            --border-color: #e0e0e0;
            --success-bg: #e6f4ea;
            --success-text: #137333;
            --error-bg: #fce8e6;
            --error-text: #c5221f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--background-light);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- Container/Card Styling --- */
        .container {
            background: var(--card-background);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .project-title {
            color: var(--primary-color);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: #70757a;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        h2 {
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        /* --- Message Styles --- */
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: left;
            font-size: 14px;
        }

        .error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #f1c3c1;
        }

        .success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #94d0a3;
        }

        /* --- Form Elements --- */
        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fcfcfc;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
            background-color: var(--card-background);
        }

        /* --- Button --- */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            margin-bottom: 30px;
        }

        button:hover {
            background-color: var(--primary-dark);
            box-shadow: 0 2px 5px rgba(26, 115, 232, 0.3);
        }

        /* --- Link --- */
        .login-link {
            color: var(--primary-color);
            text-decoration: none;
            text-align: center;
            display: block;
            font-weight: 500;
            font-size: 15px;
        }

        .login-link:hover {
            text-decoration: underline;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="project-title">Secure Share</div>
    <div class="tagline">Share your files securely.</div>

    <h2>Sign Up</h2>

    <p th:if="${error}" class="message error">⚠️ <span th:text="${error}"></span></p>
    <p th:if="${success}" class="message success">✅ <span th:text="${success}"></span></p>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" placeholder="Choose a unique username" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" th:field="*{email}" placeholder="your.email@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Must be at least 8 characters" required>

        <button type="submit">Create My Account</button>
    </form>

    <a href="/login" class="login-link">Already have an account? Log In</a>
</div>
</body>
</html>
